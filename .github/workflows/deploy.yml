name: Deploy staging

on:
  push:
    branches: [main]
  # Valide aussi les PR (tests + build) sans jamais déployer : le job
  # deploy ci-dessous est réservé aux push sur main.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Build
        run: npm run build

  # Tests Postgres RÉELS du connecteur RusHour (RLS, trigger d'enqueue,
  # concurrence FOR UPDATE SKIP LOCKED) sur une base jetable du runner -
  # jamais sur le projet Supabase.
  rushour-db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: RusHour DB tests
        run: npm run test:db:rushour
        env:
          RUSHOUR_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

  deploy:
    needs: [test-and-build, rushour-db-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Servi depuis mvpcommande.github.io/Mvp-staging/ - pas de
      # domaine personnalisé pour un environnement de test, donc
      # base = le nom du dépôt, pas la racine.
      # Identifiants du projet Supabase de TEST (kkhlpeqherxfdnilewkp),
      # jamais ceux de production - c'est tout l'intérêt de ce dépôt.
      - name: Build against the staging Supabase project
        run: npx vite build --base=/-Mvp-staging/
        env:
          VITE_SUPABASE_URL: https://kkhlpeqherxfdnilewkp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yHK0CsWF2mYRRyAauMMW-Q_-AwHJXFl

      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add /tmp/gh-pages-deploy gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages-deploy
          fi

          rm -rf /tmp/gh-pages-deploy/*
          cp -r dist/. /tmp/gh-pages-deploy/
          cd /tmp/gh-pages-deploy
          git add -A
          git diff --staged --quiet && echo "Rien à déployer" && exit 0
          git commit -m "Deploy ${{ github.sha }}"
          git push origin gh-pages
